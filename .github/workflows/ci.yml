name: CI

on:
  pull_request:

  push:
    branches:
      - nau/*.master

jobs:
  translations_is_missing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.11
        cache: pip # caching pip dependencies
    - run: pip install -r requirements.txt
    - run: make translations_is_missing
